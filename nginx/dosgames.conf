server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/dosgames;
    index index.html;

    # Required by js-dos / EmulatorJS for SharedArrayBuffer (threaded WASM cores)
    add_header Cross-Origin-Opener-Policy   same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin  always;

    # Box art, game uploads and hide state are handled by the local admin service.
    location /api/ {
        # Uploads arrive as bounded chunks, so this caps one slice, not the file.
        client_max_body_size 20m;
        client_body_buffer_size 1m;
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hidden-game list; absent until the first game is hidden.
    location = /hidden.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Edited titles/subtitles; absent until the first edit is saved.
    location = /meta.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Uploaded box art. May legitimately not exist yet.
    location /art/ {
        alias /opt/art/;
        access_log off;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-cache";
    }

    # ROMs and BIOS are served from outside the web root.
    location /roms/ {
        alias /opt/roms/Roms/;
        default_type application/octet-stream;
        add_header Cross-Origin-Opener-Policy   same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin  always;
        add_header Accept-Ranges bytes;
    }

    location /bios/ {
        alias /opt/roms/Bios/;
        default_type application/octet-stream;
        add_header Cross-Origin-Opener-Policy   same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin  always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.jsdos$ {
        default_type application/zip;
        add_header Cross-Origin-Opener-Policy   same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin  always;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy   same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin  always;
    }
}
